services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: prada-portainer
    restart: always
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_infra_data:/data

volumes:
  portainer_infra_data:
